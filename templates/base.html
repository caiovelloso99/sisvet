<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SisVet{% endblock %}</title>
  <style>
    :root {
      --bg: #f5f6f8; --card: #ffffff; --text: #1d2330; --muted: #6b7280;
      --border: #e2e5ea; --accent: #2563eb; --danger: #dc2626; --ok: #15803d;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0f1420; --card: #171e2e; --text: #e6e9f0; --muted: #9aa3b5;
        --border: #2a3347; --accent: #60a5fa; --danger: #f87171; --ok: #22c55e;
      }
    }
    * { box-sizing: border-box; }
    a { color: var(--accent); }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    header { background: var(--card); border-bottom: 1px solid var(--border); padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
    header nav a { color: var(--text); text-decoration: none; margin-right: 14px; }
    header nav a:hover { color: var(--accent); }
    header .marca { font-weight: 700; color: var(--accent); }
    main { max-width: 980px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 1.4rem; margin: 8px 0 16px; }
    h2 { font-size: 1.05rem; margin: 0 0 12px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .btn { display: inline-block; font: inherit; padding: 9px 14px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: #fff; text-decoration: none; cursor: pointer; }
    .btn-ghost { background: transparent; color: var(--accent); }
    input, select, textarea { font: inherit; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--text); width: 100%; }
    label { display: flex; flex-direction: column; font-size: 0.85rem; color: var(--muted); gap: 4px; margin-bottom: 10px; }
    input[type="checkbox"] { width: auto; align-self: flex-start; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 4px 14px; }
    .errorlist { color: var(--danger); list-style: none; padding: 0; margin: 4px 0 0; font-size: 0.85rem; }
    .msg { padding: 10px 12px; border-radius: 8px; margin-bottom: 12px; border: 1px solid var(--border); }
    .msg.success { color: var(--ok); }
    .msg.error { color: var(--danger); }
    table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
    th, td { text-align: left; padding: 9px 6px; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 500; font-size: 0.85rem; }
    .muted { color: var(--muted); }
    .table-wrap { overflow-x: auto; }
    @media (max-width: 560px) {
      main { padding: 12px; }
      .hide-sm { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <a class="marca" href="{% url 'home' %}">SisVet</a>
    {% if user.is_authenticated %}
    <nav>
      <a href="{% url 'agenda:dia' %}">Agenda</a>
      <a href="{% url 'tutores:tutor_list' %}">Tutores</a>
      <a href="{% url 'admin:index' %}">Admin</a>
    </nav>
    <div>
      <span class="muted">{{ user.get_username }}</span>
      <form method="post" action="{% url 'logout' %}" style="display:inline">
        {% csrf_token %}
        <button class="btn btn-ghost" type="submit">Sair</button>
      </form>
    </div>
    {% endif %}
  </header>

  <main>
    {% if messages %}
      {% for message in messages %}
        <div class="msg {{ message.tags }}">{{ message }}</div>
      {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
