{% extends "base.html" %}

{% block title %}Entrar · SisVet{% endblock %}

{% block content %}
<h1>Entrar</h1>
<div class="card" style="max-width: 420px">
  {% if form.errors %}
    <div class="msg error">Usuário ou senha incorretos.</div>
  {% endif %}
  <form method="post" action="{% url 'login' %}">
    {% csrf_token %}
    <label>Usuário
      {{ form.username }}
    </label>
    <label>Senha
      {{ form.password }}
    </label>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn" type="submit">Entrar</button>
  </form>
</div>
{% endblock %}
